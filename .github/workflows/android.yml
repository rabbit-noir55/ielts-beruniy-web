name: Android APK (Expo)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Expo bog'liqliklari
        run: |
          npm install --no-audit --no-fund
          npx --yes expo install react react-native expo-status-bar expo-camera expo-location react-native-webview react-native-safe-area-context

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-36" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true

      - name: Prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: expo-gradle-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/app.json') }}
          restore-keys: |
            expo-gradle-${{ runner.os }}-

      - name: Debug keystore
        run: |
          mkdir -p android/app
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: APK yig'ish
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK nomi
        working-directory: mobile
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/ielts-davomat-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out/

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ielts-davomat-apk
          path: mobile/out/*.apk
          retention-days: 30
          if-no-files-found: error
