name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "android/**"
      - "package.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bog'liqliklar
        run: npm ci

      - name: Skaner build (assets)
        run: npm run build:app

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK nomi
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/ielts-davomat-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out/

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ielts-davomat-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Xulosa
        if: always()
        run: |
          {
            echo "### Android APK"
            echo ""
            echo "- Run: #${{ github.run_number }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "APK ni yuklab olish: **Artifacts → ielts-davomat-apk**"
          } >> "$GITHUB_STEP_SUMMARY"
