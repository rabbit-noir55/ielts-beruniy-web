name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "android/**"
      - "package.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bog'liqliklar
        run: npm ci

      - name: Skaner build (assets)
        run: npm run build:app

      # `android/capacitor-cordova-android-plugins` gitignore'da — CI'da generatsiya qilinadi.
      - name: Sayt build
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Runner'da Android SDK tayyor. `android-actions/setup-android` ishlatilmaydi:
      # u ichida `sdkmanager tools` chaqiradi, yangi cmdline-tools'da bunday paket yo'q.
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" > /dev/null 2>&1 || true
          fi
          echo "O'rnatilgan platformalar:"
          ls "$SDK/platforms" || true
          echo "sdk.dir=$SDK" > "$GITHUB_WORKSPACE/android/local.properties"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK nomi
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/ielts-davomat-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out/

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ielts-davomat-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Xulosa
        if: always()
        run: |
          {
            echo "### Android APK"
            echo ""
            echo "- Run: #${{ github.run_number }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "APK ni yuklab olish: **Artifacts → ielts-davomat-apk**"
          } >> "$GITHUB_STEP_SUMMARY"
