name: OpenCode Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Qo'shimcha ko'rsatma (bo'sh bo'lsa TASKS.md navbatidan oladi)"
        required: false
        default: ""
      minutes:
        description: "Agent vaqt byudjeti (daqiqa, 1-330). 330 = ~5.5 soat"
        required: false
        default: "90"

permissions:
  contents: write

concurrency:
  group: opencode-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GIT_PUSH_BRANCH: "main"
      CI: "true"
      VITE_TELEGRAM_BOT_URL: "https://t.me/ielts_beruniy_bot"
      VITE_SITE_URL: "https://ieltsberuniy.netlify.app"
      VITE_API_URL: "http://127.0.0.1:8000/api"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Git identifikatsiya
        run: |
          git config user.name "opencode-agent"
          git config user.email "opencode-agent@users.noreply.github.com"

      - name: Snapshot tag (qaytish nuqtasi)
        run: |
          TAG="pre-ai-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "### Snapshot: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Qaytish: git reset --hard $TAG && git push --force-with-lease origin main" >> "$GITHUB_STEP_SUMMARY"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bog'liqliklar
        run: npm ci

      - name: Playwright brauzer
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Dev server
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/dev.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173 >/dev/null && break
            sleep 2
          done
          if curl -sf http://127.0.0.1:5173 >/dev/null; then
            echo "dev server tayyor: http://127.0.0.1:5173"
          else
            echo "dev server ishga tushmadi"
            cat /tmp/dev.log
            exit 1
          fi

      - name: OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Agent
        id: agent
        continue-on-error: true
        timeout-minutes: 335
        env:
          TASK: ${{ inputs.task }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -o pipefail

          PROMPT="$(cat .github/agent-prompt.md)"
          PROMPT="${PROMPT//\{\{TASK\}\}/$TASK}"
          PROMPT="${PROMPT//\{\{MINUTES\}\}/$MINUTES}"

          opencode run --standalone --auto --format json \
            --model opencode-go/kimi-k2.7-code \
            "$PROMPT" 2>&1 | tee agent-log.jsonl

      - name: Xulosa
        if: always()
        run: |
          {
            echo "### Agent natijasi"
            echo ""
            echo "- Status: \`${{ steps.agent.outcome }}\`"
            echo "- Branch: \`$(git rev-parse --abbrev-ref HEAD)\`"
            echo "- Oxirgi commit: \`$(git log -1 --pretty=%s)\`"
            echo ""
            echo "#### PROGRESS.md"
            echo ""
            head -40 PROGRESS.md || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Qoldiqni saqlash
        if: always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Saqlanadigan o'zgarish yo'q"
          else
            git commit -m "ai: qoldiq (run ${{ github.run_id }})"
            git push origin "HEAD:${GIT_PUSH_BRANCH}"
          fi

      - name: Screenshotlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Log yuklash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: agent-log.jsonl
          retention-days: 14
          if-no-files-found: ignore
